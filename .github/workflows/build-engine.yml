name: build-engine

# 苍龙音乐下载引擎自动构建：
#   上游 guohuiyuan/go-music-dl 发新版 → 本 workflow 自动用 GOOS=android
#   交叉编译含 compat_server 兼容层的 libmusdl_arm64-v8a.so → 发 GitHub Release。
# 注意：必须在 GOOS=android 下编译（GOOS=linux 在安卓上 x509 全挂，历史踩坑）。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制重建（删除已有 Release 重发）"
        type: boolean
        default: false
  schedule:
    - cron: "0 21 * * *"        # 每天一次（UTC 21:00 = 北京 05:00）
  push:
    branches: [main]
    paths: ['.github/workflows/build-engine.yml']   # CI 脚本变更时也触发（含首次推送）
  # B3 上游发版即时触发：上游（或任何持有 token 的一方）发 release 后调
  #   POST /repos/canglongkang/canglong-music/dispatches
  #   {"event_type":"upstream-release"}
  # 几分钟内即出苍龙版引擎；版本没变时下面的跳过逻辑自动兜底，重复调用无害。
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 查上游最新版本
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/guohuiyuan/go-music-dl/releases/latest --jq .tag_name)
          echo "上游最新 release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 该版本已构建过则跳过（push 触发或勾选 force 时强制重建）
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'push' && 'true' || inputs.force || 'false' }}
        run: |
          if [ "$FORCE" != "true" ] && gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "已存在 ${{ steps.ver.outputs.tag }} 的 Release，跳过"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 强制重建时删除旧 Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "删除旧 Release $TAG（强制重建）"
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

      - name: 拉上游源码（优先 release tag，缺 tag 回落 main）
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.ver.outputs.tag }}" \
            https://github.com/guohuiyuan/go-music-dl.git upstream \
          || git clone --depth 1 https://github.com/guohuiyuan/go-music-dl.git upstream

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip != 'true'
        with:
          go-version: '1.27.3'

      - name: 注入 compat_server 并编译（GOOS=android arm64 + amd64）
        if: steps.check.outputs.skip != 'true'
        run: |
          cp compat_server.go upstream/cmd/music-dl/
          cd upstream
          # arm64：真机用（APK 内 lib/arm64-v8a/libmusdl.so）
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-w -s" -o ../libmusdl_arm64-v8a.so ./cmd/music-dl
          file ../libmusdl_arm64-v8a.so
          # B2 amd64/x86_64：MuMu 等模拟器场景（x86+Houdini 转译 arm64 引擎搜索会崩）；
          # 真机不受影响。先出资产供模拟器侧载/后续 x86 APK 变体使用。
          CGO_ENABLED=0 GOOS=android GOARCH=amd64 \
            go build -trimpath -ldflags="-w -s" -o ../libmusdl_x86_64.so ./cmd/music-dl
          file ../libmusdl_x86_64.so

      - name: 生成 manifest.json
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          SHA=$(sha256sum libmusdl_arm64-v8a.so | awk '{print $1}')
          SIZE=$(stat -c%s libmusdl_arm64-v8a.so)
          SHA64=$(sha256sum libmusdl_x86_64.so | awk '{print $1}')
          SIZE64=$(stat -c%s libmusdl_x86_64.so)
          {
            echo '{'
            echo "  \"version\": \"${TAG#v}\","
            echo "  \"tag\": \"$TAG\","
            echo "  \"asset\": \"libmusdl_arm64-v8a.so\","
            echo "  \"sha256\": \"$SHA\","
            echo "  \"size\": $SIZE,"
            echo "  \"asset_x86_64\": \"libmusdl_x86_64.so\","
            echo "  \"sha256_x86_64\": \"$SHA64\","
            echo "  \"size_x86_64\": $SIZE64,"
            echo "  \"built_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo '}'
          } > manifest.json
          cat manifest.json

      - name: 发布 GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" libmusdl_arm64-v8a.so libmusdl_x86_64.so manifest.json \
            --title "引擎 $TAG（苍龙构建 GOOS=android arm64+amd64）" \
            --notes "上游 go-music-dl $TAG + compat_server 兼容层。GOOS=android（安卓系统 CA + 公共 DNS）。arm64=真机，x86_64=模拟器（侧载用）。sha256 见 manifest.json。"

      # ---- Gitee 同步（Gitee 公开仓库审核通过后：取消注释并配 secret GITEE_TOKEN）----
      # - name: 同步附件到 Gitee Release（国内主下载源）
      #   if: steps.check.outputs.skip != 'true'
      #   env:
      #     GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      #     TAG: ${{ steps.ver.outputs.tag }}
      #   run: |
      #     OWNER=canglongkang REPO=canglong-music
      #     BODY=$(jq -n --arg t "$TAG" '{tag_name:$t,name:$t,target_commitish:"main",body:"同步自 GitHub Release"}')
